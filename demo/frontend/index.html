<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillSprint · Study Deck</title>

<!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

<!-- Brand overrides -->
<link rel="stylesheet" href="css/custom.css">
</head>
<body>

<!-- ============ TOAST CONTAINER ============ -->
<div id="toast-stack" class="toast-container position-fixed top-0 end-0 p-3" style="z-index:1080;"></div>

<!-- ============ AUTH SCREEN ============ -->
<div id="auth-screen" class="auth-screen d-flex align-items-center justify-content-center min-vh-100 py-5 px-3">
  <div class="w-100" style="max-width:420px;">

    <div class="text-center mb-4">
      <span class="brand-dot mx-auto mb-2"></span>
      <h1 class="fw-bold">SkillSprint</h1>
      <p class="text-secondary">A spaced-repetition deck for the things worth remembering.</p>
    </div>

    <div class="card shadow-sm">
      <div class="card-body p-4">

        <ul class="nav nav-tabs nav-fill mb-3" id="auth-tabs" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active" id="tab-login-btn" data-bs-toggle="tab" data-bs-target="#tab-login" type="button" role="tab">Sign in</button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" id="tab-register-btn" data-bs-toggle="tab" data-bs-target="#tab-register" type="button" role="tab">Register</button>
          </li>
        </ul>

        <div class="tab-content">
          <!-- LOGIN -->
          <div class="tab-pane fade show active" id="tab-login" role="tabpanel">
            <form id="login-form">
              <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" class="form-control" name="username" autocomplete="username" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" name="password" autocomplete="current-password" required>
              </div>
              <button type="submit" class="btn btn-primary w-100">Log in</button>
              <div class="text-danger small mt-2" id="login-error"></div>
            </form>
          </div>

          <!-- REGISTER -->
          <div class="tab-pane fade" id="tab-register" role="tabpanel">
            <form id="register-form">
              <div class="mb-3">
                <label class="form-label">Choose a username</label>
                <input type="text" class="form-control" name="username" autocomplete="username" minlength="3" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Choose a password</label>
                <input type="password" class="form-control" name="password" autocomplete="new-password" minlength="6" required>
              </div>
              <p class="text-secondary small">New accounts start as a Learner. A mentor or admin can promote your role afterwards.</p>
              <button type="submit" class="btn btn-primary w-100">Create account</button>
              <div class="text-danger small mt-2" id="register-error"></div>
            </form>
          </div>
        </div>

      </div>
    </div>

    <div class="text-center mt-3">
      <button type="button" class="btn btn-link btn-sm text-decoration-none" id="open-settings">
        <i class="bi bi-gear"></i> API endpoint settings
      </button>
    </div>
  </div>
</div>

<!-- ============ SETTINGS MODAL ============ -->
<div class="modal fade" id="settings-modal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Backend connection</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p class="text-secondary small">Point this frontend at your running Spring Boot API.</p>
        <label class="form-label">API base URL</label>
        <input type="text" class="form-control" id="api-base-input" placeholder="http://localhost:8080/api">
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" id="settings-save">Save</button>
      </div>
    </div>
  </div>
</div>

<!-- ============ APP SHELL ============ -->
<div id="app-shell" class="d-none">

  <!-- Mobile top bar -->
  <nav class="navbar navbar-dark bg-dark d-md-none px-3">
    <button class="btn btn-outline-light btn-sm" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebar-offcanvas">
      <i class="bi bi-list"></i>
    </button>
    <span class="navbar-brand mb-0 h1 ms-2"><span class="brand-dot brand-dot-sm"></span> SkillSprint</span>
  </nav>

  <div class="d-flex">
    <!-- Sidebar (desktop) -->
    <aside class="sidebar d-none d-md-flex flex-column bg-dark text-light p-3">
      <div id="sidebar-inner"></div>
    </aside>

    <!-- Sidebar (mobile offcanvas) -->
    <div class="offcanvas offcanvas-start bg-dark text-light" tabindex="-1" id="sidebar-offcanvas">
      <div class="offcanvas-header">
        <span class="navbar-brand mb-0 h1"><span class="brand-dot brand-dot-sm"></span> SkillSprint</span>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
      </div>
      <div class="offcanvas-body p-3">
        <div id="sidebar-inner-mobile"></div>
      </div>
    </div>

    <!-- Main content -->
    <main class="main-view flex-grow-1 p-3 p-md-4">
      <header class="d-flex align-items-end justify-content-between flex-wrap gap-2 mb-4">
        <div>
          <p class="text-uppercase small fw-semibold text-primary mb-1" id="view-eyebrow" style="letter-spacing:.06em;">Overview</p>
          <h1 class="h3 mb-0" id="view-title">Dashboard</h1>
        </div>
        <div class="d-flex gap-2" id="header-actions"></div>
      </header>
      <div id="view-body" class="d-flex flex-column gap-4"></div>
    </main>
  </div>
</div>

<template id="tpl-flashcard">
  <div class="card flashcard h-100">
    <div class="card-header small text-uppercase fw-semibold text-secondary">Question</div>
    <div class="card-body">
      <p class="card-text front-content mb-0"></p>
      <div class="collapse mt-3 back-collapse">
        <div class="border-top pt-3">
          <span class="badge text-bg-warning mb-2">Answer</span>
          <p class="card-text back-content mb-0"></p>
        </div>
      </div>
    </div>
    <div class="card-footer bg-transparent border-0 pt-0 reveal-footer">
      <button type="button" class="btn btn-outline-secondary btn-sm reveal-btn">
        <i class="bi bi-eye"></i> Show answer
      </button>
    </div>
  </div>
</template>

<!-- Axios -->
<script src="https://cdn.jsdelivr.net/npm/axios@1.7.7/dist/axios.min.js"></script>
<!-- Bootstrap bundle (includes Popper) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/state.js"></script>
<script src="js/ui.js"></script>
<script src="js/views.js"></script>
<script src="js/app.js"></script>
</body>
</html>
